name: Tests

on:
  push:
    branches: [main, gallery]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest voluptuous "pypixelcolor>=0.5.0,<0.6"
      - name: Byte-compile every module
        run: python -m compileall -q custom_components
      - run: python -m pytest -q
