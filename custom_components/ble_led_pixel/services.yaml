show_slot:
  name: Show stored picture
  description: >
    Display a picture already stored on the panel. Sends seven bytes instead of
    the whole image - on a 32x32 panel that is 7 bytes rather than 12288. Store
    pictures first using the "save slot" field of send_image_file or
    send_mdi_icon. Showing an empty slot makes the panel cycle through the slots
    that do hold something.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    slot:
      name: Slot
      description: Slot number to display
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

delete_slot:
  name: Delete stored picture
  description: Erase one stored picture from the panel.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    slot:
      name: Slot
      description: Slot number to erase
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 255
          mode: box

show_emoji:
  name: Show Emoji
  description: >
    Display an emoji (Twemoji) on the panel. The PNG is downloaded
    once from the Twemoji CDN, cached locally, and rendered at the device
    dimensions. Useful for HA notifications (doorbell, alerts, etc.).
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    emoji:
      name: Emoji
      description: A single emoji character (or sequence) to display
      required: true
      example: "🔔"
      selector:
        text:
    bg_color:
      name: Background Color
      description: Background color (defaults to black)
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    width:
      name: Width override
      description: >
        Optional canvas width override. Use only if the firmware reports
        incorrect dimensions for your panel. Default: device-reported width.
      required: false
      example: 32
      selector:
        number:
          min: 1
          max: 512
          mode: box
    height:
      name: Height override
      description: >
        Optional canvas height override. Use only if the firmware reports
        incorrect dimensions for your panel. Default: device-reported height.
      required: false
      example: 32
      selector:
        number:
          min: 1
          max: 512
          mode: box

send_mdi_icon:
  name: Send MDI Icon
  description: Renders a Home Assistant MDI icon (fetched from @mdi/svg) and displays it on the panel panel.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    icon:
      name: Icon
      description: MDI icon name, e.g. "mdi:battery-outline" or "battery-outline"
      required: true
      example: "mdi:weather-sunny"
      selector:
        icon:
    color:
      name: Icon Color
      description: Icon fill color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    bg_color:
      name: Background Color
      description: Canvas background color
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    scale:
      name: Icon Size
      description: Icon size as a percentage of the panel's smaller dimension
      required: false
      default: 100
      selector:
        number:
          min: 10
          max: 100
          mode: slider
          unit_of_measurement: "%"
    save_slot:
      name: Save Slot
      description: Device memory slot to save the icon to (0 = don't save)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10

send_text:
  name: Send Text
  description: >-
    Sends text using pypixelcolor's native text renderer, with its own
    text/color/animation parameters each call - independent of the panel's
    currently selected text/effect/speed/colors. Intended for use from
    automations and scripts.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    text:
      name: Text
      description: Text to display (supports emojis)
      required: true
      example: "Hello World"
      selector:
        text:
    color:
      name: Text Color
      description: Text color
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    bg_color:
      name: Background Color
      description: Background color. Leave unset for a transparent background.
      required: false
      selector:
        color_rgb:
    font:
      name: Font
      description: >
        Font to render with. The fonts shipped with the integration are listed
        below; any other font in the integration's fonts/ folder, in the
        pypixelcolor package or in a system font path also works. Drop your own
        .ttf or .otf into the fonts/ folder and restart to add one.
      required: false
      default: "VCR_OSD_MONO"
      selector:
        select:
          custom_value: true
          options:
            - "3x5-de"
            - "5x5"
            - "7x5"
            - "Lepidos"
            - "OpenSans-Light"
            - "VCR_OSD_MONO"
            - "WP7xn"
    animation:
      name: Animation
      description: >-
        Effect the panel applies to the text. Values 3 and 4 are rejected by
        the library on panels that are not 32x32, to avoid a device bootloop,
        so they are not offered here.
      required: false
      default: 0
      selector:
        select:
          options:
            - label: "Fixed"
              value: "0"
            - label: "Scroll left"
              value: "1"
            - label: "Scroll right"
              value: "2"
            - label: "Blinking"
              value: "5"
            - label: "Breathing"
              value: "6"
            - label: "Snowflake"
              value: "7"
            - label: "Laser"
              value: "8"
    speed:
      name: Speed
      description: Animation speed (0-100)
      required: false
      default: 80
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    rainbow_mode:
      name: Rainbow Mode
      description: Rainbow color-cycling mode (0-9, 0 = disabled)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 9

send_test_pattern:
  name: "[DIAGNOSTIC] Send Test Pattern"
  description: >-
    Send a four-quadrant colour pattern (red/green/blue/yellow) at the size
    the device reports, to work out empirically how the logical buffer maps
    onto the physical panel. Remove once that mapping is confirmed.
  target:
    entity:
      integration: ble_led_pixel
      domain: text

send_layout:
  name: Send Layout
  description: >-
    Compose an MDI icon, an image and up to four texts, each positioned
    independently by its top-left corner, and send them to the panel as a
    single image.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    icon:
      name: Icon
      description: MDI icon, e.g. "mdi:battery-outline". Leave empty to show none.
      required: false
      example: "mdi:weather-sunny"
      selector:
        icon:
    icon_x:
      name: Icon X
      description: X position of the icon's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    icon_y:
      name: Icon Y
      description: Y position of the icon's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    icon_size:
      name: Icon Size
      description: Icon size in pixels (square). Defaults to the panel's shorter side.
      required: false
      selector:
        number:
          min: 1
          max: 999
    icon_color:
      name: Icon Color
      description: Icon colour
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    icon_blink:
      name: Icon Blink
      description: When on, the icon blinks on and off at a fixed interval
      required: false
      default: false
      selector:
        boolean:
    icon_blink_interval_ms:
      name: Icon Blink Interval
      description: How long each blink state (on or off) lasts, in milliseconds
      required: false
      default: 500
      selector:
        number:
          min: 50
          max: 5000
    icons:
      name: Icons (multiple)
      description: >-
        Up to four independent MDI icons, each with its own position, size,
        colour and blink setting. YAML only. When present it takes precedence
        over the icon/icon_x/... fields above. Each entry takes: icon
        (required), x, y, size, color_hex, blink, blink_interval_ms. Icons
        never scroll, but they can blink.
      required: false
      example: |
        - icon: "mdi:weather-sunny"
          x: 0
          y: 0
          size: 16
        - icon: "mdi:water-alert"
          x: 20
          y: 0
          size: 16
          blink: true
          blink_interval_ms: 300
      selector:
        object:
    image_path:
      name: Image Path
      description: >-
        Absolute path to an image or GIF to place in the layout (only the
        first frame is used if it is animated), readable by Home Assistant,
        for example under /config/www/. Leave empty to place none.
      required: false
      example: "/config/www/logo.png"
      selector:
        text:
    image_x:
      name: Image X
      description: X position of the image's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    image_y:
      name: Image Y
      description: Y position of the image's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    image_width:
      name: Image Width
      description: When set, resizes the image to this width in pixels
      required: false
      selector:
        number:
          min: 1
          max: 999
    image_height:
      name: Image Height
      description: When set, resizes the image to this height in pixels
      required: false
      selector:
        number:
          min: 1
          max: 999
    text:
      name: Text
      description: Text to show. Leave empty to show none.
      required: false
      example: "21°C"
      selector:
        text:
    text_x:
      name: Text X
      description: X position of the text's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    text_y:
      name: Text Y
      description: Y position of the text's top-left corner, in pixels
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
    text_size:
      name: Text Size
      description: Font size in pixels, fractional allowed - scales the text dynamically
      required: false
      default: 6
      selector:
        number:
          min: 1
          max: 64
          step: 0.5
    text_font:
      name: Text Font
      description: >-
        Bundled font. "3x5-de" is the smallest available. "Lepidos" is a 3x7
        pixel font (CC0 / public domain) and looks best at sizes that are
        multiples of 16 (16, 32, ...).
      required: false
      selector:
        select:
          options:
            - "3x5-de"
            - "5x5"
            - "7x5"
            - "Lepidos"
            - "OpenSans-Light"
            - "WP7xn"
    text_color:
      name: Text Color
      description: Text colour
      required: false
      default: [255, 255, 255]
      selector:
        color_rgb:
    text_wrap:
      name: Text Wrap
      description: >-
        When on (the default), text wraps automatically once it passes the
        panel's right edge. A "\n" in the text always forces a line break,
        regardless of this option. Note that wrapping redistributes words and
        does not preserve exact spacing - turn it off when you need precise
        leading, trailing or inner spaces, for example to align by hand.
      required: false
      default: true
      selector:
        boolean:
    text_align:
      name: Text Align
      description: >-
        Horizontal alignment of the text within its own block: "left"
        (default), "right" or "center". Matters mostly with several lines
        (separated by "\n") of differing width.
      required: false
      default: "left"
      selector:
        select:
          options:
            - "left"
            - "right"
            - "center"
    text_line_spacing:
      name: Text Line Spacing
      description: Extra vertical space between lines, in pixels
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 20
    text_scroll:
      name: Text Scroll
      description: >-
        When on, text too wide for the space available scrolls in a
        continuous loop (as an animated GIF) instead of being cut off. No
        effect when the text already fits. To shorten transfer time on heavy
        GIFs, raise scroll_step, which produces fewer frames.
      required: false
      default: false
      selector:
        boolean:
    text_blink:
      name: Text Blink
      description: When on, the text blinks on and off at a fixed interval
      required: false
      default: false
      selector:
        boolean:
    text_blink_interval_ms:
      name: Text Blink Interval
      description: How long each blink state (on or off) lasts, in milliseconds
      required: false
      default: 500
      selector:
        number:
          min: 50
          max: 5000
    texts:
      name: Texts (multiple)
      description: >-
        Up to four independent texts, each with its own position, size, font,
        colour, wrap, alignment, scroll and blink setting. YAML only. When
        present it takes precedence over the text/text_x/... fields above.
        Each entry takes: text (required), x, y, size, font, color_hex, wrap,
        align, scroll, line_spacing, blink, blink_interval_ms.
      required: false
      example: |
        - text: "Living room"
          x: 0
          y: 0
          size: 6
        - text: "21°C"
          x: 0
          y: 8
          size: 8
          scroll: true
        - text: "ALARM"
          x: 0
          y: 16
          size: 8
          blink: true
          blink_interval_ms: 300
      selector:
        object:
    scroll_step:
      name: Scroll Speed
      description: >-
        Pixels moved per frame, shared by every scrolling text. Higher is
        faster but less smooth.
      required: false
      default: 2
      selector:
        number:
          min: 1
          max: 20
    scroll_frame_ms:
      name: Scroll Frame Duration
      description: Durata di ogni frame dell'animazione, in millisecondi
      required: false
      default: 80
      selector:
        number:
          min: 20
          max: 1000
    scroll_gap:
      name: Scroll Gap
      description: Pixel vuoti tra la fine di un giro e l'inizio del successivo
      required: false
      default: 16
      selector:
        number:
          min: 0
          max: 200
    bg_color:
      name: Background Color
      description: Panel background colour
      required: false
      default: [0, 0, 0]
      selector:
        color_rgb:
    save_slot:
      name: Save Slot
      description: Device memory slot to store the picture in (0 = do not store)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10

send_image_file:
  name: Send Image File
  description: >
    Send an image or GIF that already exists and is readable by Home
    Assistant, for example under /config/www/. Supports PNG, GIF (animated
    GIFs are sent as they are, frame by frame), JPEG, BMP, TIFF, WEBP and
    HEIC/HEIF.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    file_path:
      name: File Path
      description: Absolute path to the file, e.g. /config/www/my_animation.gif
      required: true
      example: "/config/www/my_animation.gif"
      selector:
        text:
    resize_method:
      name: Resize Method
      description: >
        "crop" fills the panel and cuts off what does not fit, "fit" scales
        the whole image down and pads it with black.
      required: false
      default: "crop"
      selector:
        select:
          options:
            - "crop"
            - "fit"
    save_slot:
      name: Save Slot
      description: Device memory slot to store the picture in (0 = do not store)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10
show_preset:
  name: Show preset
  description: >-
    Show one of the twenty animations stored in the panel's own firmware.
    Nothing is transferred, so this is far cheaper than sending a picture.
    Which animations these are depends on the model - some ship road signs,
    others a set of moods. Not every panel has presets; the action fails with
    a clear message when yours does not.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    preset:
      name: Preset
      description: Preset number.
      required: true
      example: 6
      selector:
        number:
          min: 1
          max: 20
    language:
      name: Language
      description: >-
        Language byte sent alongside, used by presets that contain wording.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 255

set_scoreboard:
  name: Set scoreboard
  description: >-
    Show two scores on the panel. Only some models have a scoreboard.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    home:
      name: Home
      description: First score.
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 65535
    away:
      name: Away
      description: Second score.
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 65535

set_countdown:
  name: Set countdown
  description: >-
    Start or stop the countdown timer. The panel counts down on its own.
    Only the "mecha" panel family has a countdown.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    running:
      name: Running
      description: Turn the countdown on or off.
      required: true
      example: true
      selector:
        boolean:
    minutes:
      name: Minutes
      description: Minutes to count down from.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 99
    seconds:
      name: Seconds
      description: Seconds to count down from.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59

set_stopwatch:
  name: Set stopwatch
  description: >-
    Start or stop the stopwatch. The panel counts on its own, and there is no
    command to read the elapsed time back.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    running:
      name: Running
      description: Start or stop the stopwatch.
      required: true
      example: true
      selector:
        boolean:

set_password:
  name: Set password
  description: >-
    Set or remove the panel's password. Think before using this: a locked
    panel connects normally and then silently discards everything sent to it,
    and the only way back without the password is a power-cycle reset at the
    panel itself.
    The password is stored in the integration options as part of this action,
    so Home Assistant can still reach the panel afterwards - it is sent again
    after every connect. Write it down somewhere else too.
    Most models take six digits, two known models take four; the right length
    is checked against your panel.
  target:
    entity:
      integration: ble_led_pixel
      domain: text
  fields:
    password:
      name: Password
      description: >-
        Digits only. When setting, the new password. When removing, the
        password currently on the panel.
      required: true
      example: "123456"
      selector:
        text:
          type: password
    enabled:
      name: Enabled
      description: >-
        On sets the password, off removes it.
      required: false
      default: true
      selector:
        boolean:
