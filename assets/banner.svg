      <rect x="18" y="79" width="13" height="13" rx="2.5"/><rect x="59" y="79" width="13" height="13" rx="2.5"/>
      <rect x="79" y="79" width="13" height="13" rx="2.5"/>
    </g>
    <path d="M55 28 v54 l18-13 -18-14 18-13 -18-14" fill="none" stroke="#0f1720"
          stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <text font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" x="196" y="172" font-size="40" font-weight="700" fill="#e6edf3">BLE LED Pixel Display</text>
